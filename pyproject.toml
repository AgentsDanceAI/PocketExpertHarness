[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketexpert-harness"
version = "0.1.0"
description = "The open-core agent harness behind PocketExpert AI: ReAct engine, MCP, skills, long-term memory, CLI and web chat."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AgentsDance" }]
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]
keywords = ["agent", "llm", "react", "mcp", "skills", "harness", "openai-compatible", "deepseek", "qwen"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.urls]
Homepage = "https://agentsdance.ai"
Repository = "https://github.com/AgentsDanceAI/PocketExpertHarness"
Issues = "https://github.com/AgentsDanceAI/PocketExpertHarness/issues"

[project.scripts]
pocketexpert-harness = "pocketexpert_harness.cli:main"
peh = "pocketexpert_harness.cli:main"

[tool.setuptools.packages.find]
include = ["pocketexpert_harness*"]

[tool.setuptools.package-data]
pocketexpert_harness = ["web/*", "kernel/EXPORT.json", "builtin_skills/*/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 130
extend-exclude = ["pocketexpert_harness/kernel"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]
