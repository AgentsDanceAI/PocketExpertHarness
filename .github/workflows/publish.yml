name: publish

# 打 v* 标签 → 查发版说明 + 测试 → 打包 → 发到 PyPI (可信发布, 不存任何令牌) → 建同名 GitHub Release (版本号两边对齐)。
# 打标签前先写 .github/release-notes/<标签>.md, 格式见 scripts/release_notes.py (与口袋专家 AI 的 Release 同一套)。
# PyPI 那边的「待定发布者」须填: 项目 pocketexpert-harness / 所有者 AgentsDanceAI /
# 仓库 PocketExpertHarness / 工作流 publish.yml / 环境 pypi。只用 GitHub 托管的机器。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 标签要和包的版本号一致
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          i=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('pocketexpert_harness/__init__.py').read()).group(1))")
          [ "v$v" = "$GITHUB_REF_NAME" ] && [ "$v" = "$i" ] || { echo "::error::标签 $GITHUB_REF_NAME / pyproject $v / __init__ $i 不一致"; exit 1; }
      - name: 发版说明要按格式写好 (.github/release-notes/<标签>.md), 不然不发
        run: python scripts/release_notes.py check "$GITHUB_REF_NAME"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine && python -m build && twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: 建 GitHub Release (标题和正文取自 .github/release-notes/<标签>.md, 附同一份安装包)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title=$(python3 scripts/release_notes.py render "$GITHUB_REF_NAME" "$RUNNER_TEMP/notes.md")
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
